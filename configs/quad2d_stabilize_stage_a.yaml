backend: custom
module: ssm.tasks.quad2d_stabilize.train_accelerated
arguments:
  run_name: quad2d_stabilize_stage_a_s0
  seed: 0
  wandb: false
  tqdm_bar: false
  env_backend: python
  eval_backend: p123
  eval_suite: lowz055_hrej
  layout_name: corridor_v3
  obs_feature_mode: h_components_closing_reach
  obs_h_scale: 1.0
  obs_hdot_scale: 1.0
  agent: dzfill_qhstage_v_2
  qh_stage_mode: stage_b
  qh_candidate_source: policy_plus_gaussian
  qh_min_k_samples: 8
  qh_min_k_sigma: 0.5
  max_steps: 1000000
  start_training: 10000
  max_episode_steps: 400
  eval_interval: 50000
  eval_episodes: 100
  fixed_eval_repeats: 0
  batch_size: 512
  actor_hidden: 512,512
  critic_hidden: 512,512
  M_q: 10
  beta_safety: 5
  delta: 0.0
  hard_margin: 0.0
  h_hardgap: 0.0
  use_action_margin: false
  discount: 0.99
  discount_h: 0.999
  tau: 0.005
  T: 5
  ddpm_temperature: 0.2
  huber_delta: 10
  q_pos: 10
  q_x: 2
  q_z: 2
  q_vel: 1
  q_angle: 0.2
  action_penalty: 0.001
  dwell_bonus: 0.0
  goal_pos_radius: 0.3
  goal_vel_radius: 0.45
  goal_angle_radius: 0.25
  goal_dwell_steps: 30
  success_mode: full_state_terminal
  success_radius: 0.5
  terminate_on_success: false
  reset_mode: simple_under3
  reset_simple_bar_frac: 0.15
  reset_simple_left_block_frac: 0.15
  reset_simple_right_block_frac: 0.15
  reset_simple_gap_frac: 0.2
  reset_simple_low_uniform_frac: 0.25
  reset_simple_near_frac: 0.1
  reset_safety_bar_frac: 0.2
  reset_safety_left_block_frac: 0.15
  reset_safety_right_block_frac: 0.15
  reset_safety_gap_frac: 0.15
  reset_safety_low_uniform_frac: 0.25
  reset_safety_mid_uniform_frac: 0.05
  reset_safety_near_frac: 0.05
  simple_under_vx_abs: 0.5
  simple_under_vz_low: 0.0
  simple_under_vz_high: 0.7
  simple_bar_vz_low: 0.0
  simple_bar_vz_high: 0.7
  simple_block_vz_low: 0.0
  simple_block_vz_high: 0.7
  simple_under_xdot_zero_frac: 0.0
  simple_bar_xdot_zero_frac: 0.0
  simple_block_xdot_zero_frac: 0.0
  simple_gap_vx_abs: 0.4
  simple_gap_vz_low: -0.2
  simple_gap_vz_high: 0.5
  simple_low_uniform_vx_abs: 0.35
  simple_low_uniform_vz_abs: 0.35
  eval_reset_mode: global_safe
  init_h_threshold: 0.0
  sdf_mode: raw
  boundary_replay: false
  gate_lambda: 30
  gate_x_max: 1.0
  gate_z_center: 0.1
  gate_z_width: 1.6
