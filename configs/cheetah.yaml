backend: velocity
module: swimmer_role_particles.train_swimmer_role_particles
arguments:
  T: 5
  actor-batch-size: 64
  actor-grad-clip: 1.0
  actor-hidden: 256,256,256
  actor-lr: 0.0001
  actor-safety-mode: qh_routed
  alpha-reward: 1.0
  beta-safety: 3.0
  bridge-component-weighting: evidence
  bridge-latent-std: 0.5
  bridge-likelihood-fraction: 0.5
  bridge-reference-samples: 8
  checkpoint-interval: 100000
  critic-batch-size: 256
  critic-hidden: 256,256
  critic-lr: 0.0003
  critic-start-training: 20000
  data-particle-ess-fraction: 0.5
  ddpm-temperature: 0.2
  delta: 0.0
  discount: 0.99
  discount-h: 0.99
  env-id: SafetyHalfCheetahVelocity-v1
  epsilon-action: 1.0e-05
  eta: 0.5
  fuse-clip-max: 1000.0
  fuse-clip-min: -200.0
  h-hardgap: 0.5
  hard-margin: 0.0
  huber-delta: 10.0
  invalid-stop-threshold: 0.1
  invalid-warning-threshold: 0.05
  invalid-window: 10
  likelihood-fraction: 1.0
  log-interval: 1000
  max-steps: 1000000
  num-particles-data: 1
  num-particles-target: 1
  num-particles-train: 1
  obs-stats-calibration-steps: 10000
  output-root: runs
  particle-mode: s1_min
  posterior-samples: 64
  proposal-chunk-size: 64
  proposal-family: defensive_reference_bridge_balance_mis_v1
  qh-backup-uses-reference: false
  qh-critic-mode: single
  qh-k: 8
  qh-sigma: 0.3
  reference-refresh-interval: 500
  replay-size: 1000000
  reward-backup-mode: online_policy_k1
  reward-backup-samples: 1
  reward-kl-delta: 0.6
  reward-row-kl-cap: 1.2
  reward-tilt-mode: capped_batch_kl
  run-name: cheetah
  safe-critic-lr: 0.0003
  safety-threshold: 0.0
  seed: 0
  start-training: 30000
  target-particle-ess-fraction: 0.5
  tau: 0.005
  train-particle-ess-fraction: 0.5
  updates-per-step: 1
  wandb: false
  wandb-project: safe-score-matching
